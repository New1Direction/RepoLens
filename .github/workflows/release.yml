name: Release extension zip

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the zip to the GitHub Release on tag pushes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Release consistency
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npm run check:release -- --tag "$GITHUB_REF_NAME"
          else
            npm run check:release
          fi
      - name: Verify
        run: |
          npm test
          npm run lint
          npm run check:html
          npm run format:check
          npm audit --audit-level=high
      # Deterministic, validated build — the same zip goes to the Chrome Web Store.
      - name: Package Chrome extension
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: repolens-extension-zip
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/check-release.mjs --notes > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.json dist/*.sha256 \
            --title "RepoLens $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
